<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スタレ ガチャ計画プランナー</title>
<style>
:root {
  --bg: #f6f7fb;
  --card: #ffffff;
  --text: #1f2430;
  --muted: #6b7280;
  --line: #e3e6ee;
  --accent: #4f63d2;
  --safe: #2e9e5b;
  --wait: #d64545;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  line-height: 1.6;
}
main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
h1 { font-size: 1.35rem; margin: 8px 0 4px; }
.lead { color: var(--muted); margin: 0 0 16px; font-size: 0.95rem; }
section.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
section.card h2 { font-size: 1rem; margin: 0 0 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
.row label { flex: 1; font-size: 0.95rem; }
.row .unit { color: var(--muted); font-size: 0.85rem; margin-left: 4px; white-space: nowrap; }
input[type="number"], input[type="date"], select {
  width: 130px;
  padding: 8px 10px;
  font-size: 1rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--text);
}
select { width: auto; max-width: 180px; }
input[type="number"] { text-align: right; }
input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }
.hint { color: var(--muted); font-size: 0.8rem; margin: 2px 0 0; }
details summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "内訳を直す ▸"; color: var(--accent); font-weight: 400; font-size: 0.9rem; }
details[open] summary::after { content: "閉じる ▾"; }
.result { border-width: 2px; }
.verdict {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 999px;
  color: #fff;
  font-weight: 700;
  font-size: 1.05rem;
}
.verdict.enough { background: var(--safe); }
.verdict.short { background: var(--wait); }
.prob { font-size: 2rem; font-weight: 700; margin: 8px 0 0; }
.prob small { font-size: 1.1rem; color: var(--muted); font-weight: 400; margin-left: 4px; }
.basis { margin: 8px 0 0; }
.note { color: var(--muted); font-size: 0.85rem; margin: 10px 0 0; }
.warn { color: var(--wait); font-size: 0.9rem; margin: 6px 0 0; }
button {
  font-size: 0.95rem;
  padding: 10px 16px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}
button.secondary { background: #fff; color: var(--accent); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.toast { color: var(--safe); font-size: 0.9rem; }
footer { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 24px; }
footer button { margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>スタレ ガチャ計画プランナー</h1>
  <p class="lead">次のピックアップに、いまの貯蓄で間に合うか。</p>

  <form id="form" autocomplete="off">
    <section class="card">
      <h2>1. 目標のガチャ</h2>
      <div class="row">
        <label for="targetDate">開始日</label>
        <input type="date" id="targetDate">
      </div>
      <p class="hint">公式の告知を見て、自分で入れてください。</p>
    </section>

    <section class="card">
      <h2>2. いまの手持ち</h2>
      <div class="row">
        <label for="jade">星玉<span class="unit">個</span></label>
        <input type="number" id="jade" min="0" step="1" inputmode="numeric" placeholder="0">
      </div>
      <div class="row">
        <label for="tickets">星軌専用チケット<span class="unit">枚</span></label>
        <input type="number" id="tickets" min="0" step="1" inputmode="numeric" placeholder="0">
      </div>
    </section>

    <section class="card">
      <h2>3. 天井の状況</h2>
      <div class="row">
        <label for="pity">前回 5★ からの連数<span class="unit">0〜89</span></label>
        <input type="number" id="pity" min="0" max="89" step="1" inputmode="numeric" placeholder="0">
      </div>
      <div class="row">
        <label for="guaranteed">すり抜け保証あり（前回すり抜けた）</label>
        <input type="checkbox" id="guaranteed">
      </div>
    </section>

    <section class="card">
      <h2>4. いまのガチャで使う予定</h2>
      <div class="row">
        <label for="plannedNow">使う連数<span class="unit">連</span></label>
        <input type="number" id="plannedNow" min="0" step="1" inputmode="numeric" placeholder="0">
      </div>
      <p class="hint">いま開催中のガチャを引くなら、その連数。引かないなら 0 のまま。</p>
    </section>

    <section class="card">
      <details id="incomeDetails">
        <summary>5. 収入の目安</summary>
        <div class="row">
          <label for="incDaily">デイリー任務<span class="unit">星玉／日</span></label>
          <input type="number" id="incDaily" min="0" step="1" inputmode="numeric" value="60">
        </div>
        <div class="row">
          <label for="incPass">列車補給パス（月パス）<span class="unit">星玉／日</span></label>
          <input type="checkbox" id="incPassOn" aria-label="月パスを使っている">
          <input type="number" id="incPass" min="0" step="1" inputmode="numeric" value="90">
        </div>
        <div class="row">
          <label for="incBpTier">ナナシの勲功</label>
          <select id="incBpTier">
            <option value="off">買っていない</option>
            <option value="hocho">ナナシビトの褒章</option>
            <option value="kunsho">ナナシビトの勲章</option>
          </select>
        </div>
        <div class="row">
          <label for="incBpJade">ナナシビトの褒章 星玉<span class="unit">／バージョン</span></label>
          <input type="number" id="incBpJade" min="0" step="1" inputmode="numeric" value="680">
        </div>
        <div class="row">
          <label for="incBpTickets">ナナシビトの褒章 チケット<span class="unit">枚／バージョン</span></label>
          <input type="number" id="incBpTickets" min="0" step="1" inputmode="numeric" value="4">
        </div>
        <div class="row">
          <label for="incBpDeluxeJade">ナナシビトの勲章 追加分星玉<span class="unit">／バージョン</span></label>
          <input type="number" id="incBpDeluxeJade" min="0" step="1" inputmode="numeric" value="200">
        </div>
        <div class="row">
          <label for="incSim">階差宇宙・マネーウォーズ 週間報酬<span class="unit">星玉／週</span></label>
          <input type="number" id="incSim" min="0" step="1" inputmode="numeric" value="225">
        </div>
        <div class="row">
          <label for="incMoc">混沌の記憶<span class="unit">星玉／バージョン</span></label>
          <input type="number" id="incMoc" min="0" step="1" inputmode="numeric" value="900">
        </div>
        <div class="row">
          <label for="incPf">虚構叙事<span class="unit">星玉／バージョン</span></label>
          <input type="number" id="incPf" min="0" step="1" inputmode="numeric" value="900">
        </div>
        <div class="row">
          <label for="incAs">末日の幻影<span class="unit">星玉／バージョン</span></label>
          <input type="number" id="incAs" min="0" step="1" inputmode="numeric" value="900">
        </div>
        <div class="row">
          <label for="incVersion">バージョン更新の臨時収入（イベント・補償・コード）<span class="unit">星玉／バージョン</span></label>
          <input type="number" id="incVersion" min="0" step="1" inputmode="numeric" value="0" placeholder="目安を自分で入れる">
        </div>
        <div class="row">
          <label for="incVersionTickets">バージョン更新の臨時収入（巡星の礼など）<span class="unit">チケット／バージョン</span></label>
          <input type="number" id="incVersionTickets" min="0" step="1" inputmode="numeric" value="0" placeholder="目安を自分で入れる">
        </div>
      </details>
    </section>
  </form>

  <section class="card result" id="result">
    <h2>結果</h2>
    <span class="verdict" id="verdict">—</span>
    <p class="prob" id="headline">—</p>
    <p class="basis" id="basis">—</p>
    <p class="warn" id="warn" hidden></p>
    <p class="note" id="note"></p>
    <div class="actions">
      <button type="button" id="copy">結果をコピー</button>
      <span class="toast" id="toast" hidden>コピーしました</span>
    </div>
  </section>

  <footer>
    <p>非公式のファンツールです。HoYoverse とは関係ありません。<br>作者: ユニフ（Unif）</p>
    <button type="button" class="secondary" id="reset">入力をリセット</button>
  </footer>
</main>
<script id="calc">
const Calc = (() => {
  const JADE_PER_PULL = 160;
  const HARD_PITY = 90;
  const SOFT_PITY_START = 74;
  const BASE_RATE = 0.006;
  const SOFT_STEP = 0.06;
  const WIN_RATE = 0.5;

  // i 連目（1〜90）の 5★ 排出率
  function rateAt(i) {
    if (i >= HARD_PITY) return 1;
    if (i < SOFT_PITY_START) return BASE_RATE;
    return Math.min(1, BASE_RATE + SOFT_STEP * (i - (SOFT_PITY_START - 1)));
  }

  // pmf[k] = 天井 pity の状態から、いまから k 連目で初めて 5★ が出る確率。pmf[0] = 0
  function fiveStarPmf(pity) {
    const pmf = [0];
    let alive = 1; // まだ 5★ が出ていない確率
    for (let k = 1; pity + k <= HARD_PITY; k++) {
      const r = rateAt(pity + k);
      pmf.push(alive * r);
      alive *= 1 - r;
    }
    return pmf;
  }

  // n 連以内に 5★ が出る確率
  function probFiveStarWithin(pity, n) {
    const pmf = fiveStarPmf(pity);
    let s = 0;
    for (let k = 1; k <= n && k < pmf.length; k++) s += pmf[k];
    return Math.min(1, s);
  }

  // n 連以内に目標キャラ（ピックアップ）を引ける確率
  // 保証なし: 1 回目の 5★ で勝つ 50% ＋ すり抜けて残りの連数で 2 回目の 5★ を引く 50%
  function probLimitedWithin(state, n) {
    if (n <= 0) return 0;
    const pmf = fiveStarPmf(state.pity);
    let s = 0;
    for (let k = 1; k <= n && k < pmf.length; k++) {
      if (state.guaranteed) s += pmf[k];
      else s += pmf[k] * (WIN_RATE + (1 - WIN_RATE) * probFiveStarWithin(0, n - k));
    }
    return Math.min(1, s);
  }

  // 確定に必要な連数（最悪ケース）
  function pullsForGuarantee(state) {
    return (state.guaranteed ? HARD_PITY : HARD_PITY * 2) - state.pity;
  }

  const VERSION_DAYS = 42;
  const WEEK_DAYS = 7;
  const MS_PER_DAY = 86400000;

  // 空欄・NaN・負の値は 0 にそろえる
  function num(v) {
    const n = Number(v);
    return Number.isFinite(n) && n > 0 ? n : 0;
  }

  function toPulls(jade, tickets) {
    return Math.floor(num(jade) / JADE_PER_PULL) + Math.floor(num(tickets));
  }

  // 'YYYY-MM-DD' を UTC の日付にする（時差や夏時間で日数がずれないように）
  function parseISO(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if (!m) return null;
    return Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  }

  function formatISO(ms) {
    return new Date(ms).toISOString().slice(0, 10);
  }

  function daysUntil(todayISO, targetISO) {
    const t = parseISO(todayISO);
    const g = parseISO(targetISO);
    if (t === null || g === null) return 0;
    return Math.max(0, Math.round((g - t) / MS_PER_DAY));
  }

  function addDays(iso, n) {
    const base = parseISO(iso);
    if (base === null) return null;
    return formatISO(base + n * MS_PER_DAY);
  }

  // 「／日」「／週」の収入だけを 1 日あたりにそろえる（画面には出さない、計算専用の内部換算）
  function dailyIncome(inc) {
    const jadePerDay =
      num(inc.daily) +
      (inc.passOn ? num(inc.pass) : 0) +
      num(inc.sim) / WEEK_DAYS;
    return { jadePerDay };
  }

  // 「／バージョン」の項目は日割りしない。目標日までに確実にもらえる分をユーザーがそのまま入力する前提で、
  // 入力値をそのまま加算する（複数バージョン先が目標なら、その分は自分で数字を足して入力してもらう）
  // ナナシの勲功: 買っていない(off) / ナナシビトの褒章(hocho) / ナナシビトの勲章(kunsho、褒章＋追加分星玉)
  function flatIncome(inc) {
    const bpJade = inc.bpTier === 'off' ? 0 : num(inc.bpJade) + (inc.bpTier === 'kunsho' ? num(inc.bpDeluxeJade) : 0);
    const bpTickets = inc.bpTier === 'off' ? 0 : num(inc.bpTickets);
    const jade = bpJade + num(inc.moc) + num(inc.pf) + num(inc.as) + num(inc.version);
    const tickets = bpTickets + num(inc.versionTickets);
    return { jade, tickets };
  }

  const MAX_PITY = HARD_PITY - 1;

  function clamp(v, lo, hi) {
    return Math.min(hi, Math.max(lo, v));
  }

  function plan(inputs) {
    const daysLeft = daysUntil(inputs.today, inputs.targetDate);
    const income = inputs.income || {};
    const rate = dailyIncome(income);
    const flat = flatIncome(income);
    const handPulls = toPulls(inputs.jade, inputs.tickets);
    // 225/7 × 7 のような割り算の往復で 224.9999… になるのを防ぐため、切り捨ての前にごく小さい値を足す
    const ratePulls = Math.floor((rate.jadePerDay * daysLeft) / JADE_PER_PULL + 1e-9);
    const flatPulls = toPulls(flat.jade, flat.tickets);
    const incomePulls = ratePulls + flatPulls;
    const plannedNow = Math.floor(num(inputs.plannedNow));
    const usablePulls = handPulls + incomePulls - plannedNow;

    // いまのガチャを引き切る前提なら、目標ガチャは天井 0・保証なしから始まる
    const pityReset = plannedNow >= 1;
    const pity = clamp(Math.floor(num(inputs.pity)), 0, MAX_PITY);
    const state = pityReset ? { pity: 0, guaranteed: false } : { pity, guaranteed: !!inputs.guaranteed };

    const guaranteeNeeded = pullsForGuarantee(state);
    const shortfallPulls = Math.max(0, guaranteeNeeded - usablePulls);
    const shortfallJade = shortfallPulls * JADE_PER_PULL;
    const verdict = shortfallPulls === 0 ? 'enough' : 'short';

    const warnings = [];
    if (plannedNow > handPulls) warnings.push('planned_exceeds_hand');

    return {
      daysLeft, handPulls, incomePulls, plannedNow, usablePulls,
      state, pityReset, guaranteeNeeded, verdict,
      shortfallPulls, shortfallJade,
      warnings,
    };
  }

  return {
    JADE_PER_PULL, HARD_PITY,
    rateAt, fiveStarPmf, probFiveStarWithin, probLimitedWithin, pullsForGuarantee,
    num, toPulls, daysUntil, addDays, dailyIncome, flatIncome, plan,
  };
})();
window.Calc = Calc;
</script>
<script id="ui">
(() => {
  const $ = (id) => document.getElementById(id);

  const VERDICT_LABEL = { enough: '足りる', short: '足りない' };

  function todayISO() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }

  function readInputs() {
    return {
      today: todayISO(),
      targetDate: $('targetDate').value,
      jade: $('jade').value,
      tickets: $('tickets').value,
      pity: $('pity').value,
      guaranteed: $('guaranteed').checked,
      plannedNow: $('plannedNow').value,
      income: {
        daily: $('incDaily').value,
        passOn: $('incPassOn').checked,
        pass: $('incPass').value,
        bpTier: $('incBpTier').value,
        bpJade: $('incBpJade').value,
        bpTickets: $('incBpTickets').value,
        bpDeluxeJade: $('incBpDeluxeJade').value,
        sim: $('incSim').value,
        moc: $('incMoc').value,
        pf: $('incPf').value,
        as: $('incAs').value,
        version: $('incVersion').value,
        versionTickets: $('incVersionTickets').value,
      },
    };
  }

  function fmtDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return `${y}/${m}/${d}`;
  }

  function fmtNum(n) {
    return n.toLocaleString('ja-JP');
  }

  function render(r) {
    const v = $('verdict');
    v.textContent = VERDICT_LABEL[r.verdict];
    v.className = `verdict ${r.verdict}`;

    $('headline').innerHTML = r.verdict === 'enough'
      ? '足りています'
      : `あと ${fmtNum(r.shortfallPulls)}<small>連</small>（星玉 ${fmtNum(r.shortfallJade)}個）`;

    $('basis').textContent =
      `手持ち ${fmtNum(r.handPulls)}連 ＋ 見込み ${fmtNum(r.incomePulls)}連（目標日までの ${r.daysLeft}日分の収入）` +
      ` − 使う ${fmtNum(r.plannedNow)}連 ＝ ${fmtNum(r.usablePulls)}連。確定まで ${fmtNum(r.guaranteeNeeded)}連。`;

    const w = $('warn');
    if (r.warnings.includes('planned_exceeds_hand')) {
      w.textContent = '「いまのガチャで使う連数」が手持ちを超えています。数字はそのまま計算しています。';
      w.hidden = false;
    } else {
      w.hidden = true;
    }

    const notes = [];
    if (r.pityReset) notes.push('いまのガチャを引き切る前提なので、目標のガチャは天井 0・保証なしから計算しています。');
    $('note').textContent = notes.join(' ');
  }

  let lastResult = null;

  function update() {
    const inputs = readInputs();
    lastResult = Calc.plan(inputs);
    render(lastResult);
  }

  function buildShareText(inputs, r) {
    const lines = [];
    lines.push(`【スタレ ガチャ計画】目標 ${inputs.targetDate ? fmtDate(inputs.targetDate) : '未設定'}`);
    lines.push(`判定: ${VERDICT_LABEL[r.verdict]}`);
    lines.push(`手持ち ${r.handPulls}連 ＋ 見込み ${r.incomePulls}連 − 使う ${r.plannedNow}連 ＝ ${r.usablePulls}連（確定まで ${r.guaranteeNeeded}連）`);
    if (r.shortfallPulls > 0) {
      lines.push(`不足 ${r.shortfallPulls}連（星玉 ${r.shortfallJade}個）`);
    }
    lines.push(location.href.split('#')[0]);
    return lines.join('\n');
  }

  async function copyResult() {
    if (!lastResult) return;
    const text = buildShareText(readInputs(), lastResult);
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      // クリップボード API が使えない環境向けの逃げ道
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    const t = $('toast');
    t.hidden = false;
    setTimeout(() => { t.hidden = true; }, 2000);
  }

  const STORAGE_KEY = 'hsr-pull-planner:v1';
  const FIELDS = ['targetDate', 'jade', 'tickets', 'pity', 'plannedNow',
    'incDaily', 'incPass', 'incBpTier', 'incBpJade', 'incBpTickets', 'incBpDeluxeJade', 'incSim',
    'incMoc', 'incPf', 'incAs', 'incVersion', 'incVersionTickets'];
  const CHECKS = ['guaranteed', 'incPassOn'];

  // 初期値を控えておき、リセット時に戻す
  const DEFAULTS = {};
  FIELDS.forEach((id) => { DEFAULTS[id] = $(id).value; });
  CHECKS.forEach((id) => { DEFAULTS[id] = $(id).checked; });

  function save() {
    try {
      const data = {};
      FIELDS.forEach((id) => { data[id] = $(id).value; });
      CHECKS.forEach((id) => { data[id] = $(id).checked; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { /* プライベートモードなどで保存できないときは黙って続ける */ }
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      FIELDS.forEach((id) => { if (id in data) $(id).value = data[id]; });
      CHECKS.forEach((id) => { if (id in data) $(id).checked = !!data[id]; });
    } catch (e) { /* 壊れた保存データは無視する */ }
  }

  function reset() {
    FIELDS.forEach((id) => { $(id).value = DEFAULTS[id]; });
    CHECKS.forEach((id) => { $(id).checked = DEFAULTS[id]; });
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* 同上 */ }
    update();
  }

  // チェックボックスは古い Safari だと input を出さないので change も拾う
  const onChange = () => { update(); save(); };
  $('form').addEventListener('input', onChange);
  $('form').addEventListener('change', onChange);
  $('reset').addEventListener('click', reset);
  $('copy').addEventListener('click', copyResult);
  load();
  update();
